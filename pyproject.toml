[project]
name = "deeprag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",  # ponytail: 全仓库load_dotenv直接import(此前仅靠pydantic-settings传递依赖, 评审20261126补显式声明)
    "sse-starlette>=2.0.0",  # ponytail: /query/stream的EventSourceResponse(评审20261126补声明, 此前仅环境实装)
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.4.0",  # ponytail: ModelGateway init_chat_model("openai:...")必需, 未声明会漏装(20261125评测-I隔离模式实测踩坑)
    "aiomysql>=0.2.0",
    "passlib>=1.7.4",  # ponytail: auth.py密码哈希(评审20261126补声明, 干净环境装完起不来)
    "bcrypt>=4.0.0",  # ponytail: passlib bcrypt scheme后端
    "python-jose[cryptography]>=3.3.0",  # ponytail: JWT签发/校验(同上补声明)
    "PyMuPDF>=1.24.0",  # ponytail: 入库解析(import fitz; Docling弃用后实际解析器, 此前未声明)
    "redis>=5.2.0",
    "qdrant-client>=1.14.0",  # ponytail: >=1.14 才支持query_points服务端推理透传(Qdrant/bm25), 1.12会误走本地fastembed报错
    "oss2>=2.18.0",
    "langfuse>=2.50.0",
    "structlog>=24.0.0",
    "httpx[sse]>=0.28.0",
    "jieba>=0.42.1",
    # === 20261126 评审P2裁剪(运行时代码零import, 干净安装不再拉torch, import src.agents.graph 12.0s→2.7s实测) ===
    # litellm(网关走langchain-openai; LITELLM_*仅为env字段名保留) / celery(入库已改进程内异步)
    # docling(解析已换PyMuPDF) / pymysql(唯一驱动是aiomysql) / python-multipart(无Form/File路由)
    # sentence-transformers+FlagEmbedding(仅死代码引用, 已删) / ragas(独立judge落地时再按需装回)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
# 默认只收集 tests/; scripts/ 下是独立运行的集成脚本(顶层asyncio.run+外部服务依赖),
# 无参数pytest误收集会在import阶段创建aiomysql连接, 导致收集阶段崩溃
testpaths = ["tests"]
# 显式固定异步fixture事件循环scope, 消除pytest-asyncio未来默认值变更的deprecation告警
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
