[project]
name = "deeprag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "litellm>=1.50.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "qdrant-client>=1.14.0",  # ponytail: >=1.14 才支持query_points服务端推理透传(Qdrant/bm25), 1.12会误走本地fastembed报错
    "oss2>=2.18.0",
    "docling>=0.22.0",
    "sentence-transformers>=3.0.0",
    " FlagEmbedding>=1.2.0",
    "ragas>=0.2.0",
    "langfuse>=2.50.0",
    "structlog>=24.0.0",
    "httpx[sse]>=0.28.0",
    "python-multipart>=0.0.12",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
# 默认只收集 tests/; scripts/ 下是独立运行的集成脚本(顶层asyncio.run+外部服务依赖),
# 无参数pytest误收集会在import阶段创建aiomysql连接, 导致收集阶段崩溃
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
